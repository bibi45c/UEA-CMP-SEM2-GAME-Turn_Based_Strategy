name: Architecture site

on:
  push:
    branches: [main, 'feature/**']
    paths: ['site/**', 'Docs/Architecture_*', 'scripts/check-architecture-site.mjs', '.github/workflows/architecture-pages.yml', 'README.md', 'Assets/_Project/Scripts/**']
  pull_request:
    branches: [main]
    paths: ['site/**', 'Docs/Architecture_*', 'scripts/check-architecture-site.mjs', '.github/workflows/architecture-pages.yml', 'README.md', 'Assets/_Project/Scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check artifact hashes, source evidence and README links
        run: node scripts/check-architecture-site.mjs
      - name: Upload site for branch review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: architecture-site-preview
          path: |
            site/index.html
            site/en.html
            site/ARCHIFY-LICENSE.txt
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: architecture-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages (enable GitHub Actions in repo settings first)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload only the static site directory
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy architecture viewer
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
